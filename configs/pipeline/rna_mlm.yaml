# @package _global_
defaults:
  - /trainer: default
  - /loader: default
  - /dataset: mixed_rna
  - /optimizer: adamw
  - /scheduler: cosine_warmup_timm
  - /callbacks: [base, checkpoint]

train:
  monitor: val/loss
  mode: min

task:
  _name_: lm
  loss:
    _name_: cross_entropy
    ignore_index: 4
  torchmetrics: [perplexity, num_tokens]

encoder: null
decoder: null
