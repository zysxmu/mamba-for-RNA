_name_: multispecies_m6a_full

# Generated by scripts/prepare_multispecies_m6a.py.
data_dir: ${oc.env:MULTISPECIES_M6A_DATA_DIR,data/processed/multispecies_m6a_full_transcript}
tokenizer_name: char

# One training example is one complete 5'UTR + CDS + 3'UTR transcript.
# Longer records are explicitly counted and excluded, never truncated.
max_sequence_length: 10240
overlength_policy: exclude
require_mrna_coordinate_reliable: true
require_cds_boundary_reliable: true

pad_to_multiple: 8
batch_size: 1
batch_size_eval: 1
shuffle: true

max_train_transcripts: null
max_val_transcripts: null
max_test_transcripts: null
