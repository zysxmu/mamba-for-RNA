# Use open-source version of Mamba
_name_: caduceus_lm
config:
  _target_: caduceus.configuration_caduceus.CaduceusConfig
  # From original MambaConfig
  d_model: 128
  n_layer: 2
  vocab_size: 12
  ssm_cfg:
    d_state: 16
    d_conv: 4
    expand: 2
    dt_rank: "auto"
    dt_min: 0.001
    dt_max: 0.1
    dt_init: "random"
    dt_scale: 1.0
    dt_init_floor: 1e-4
    conv_bias: true
    bias: false
    use_fast_path: true
  rms_norm: true
  fused_add_norm: true
  residual_in_fp32: false
  pad_vocab_size_multiple: 8
  # Not in original MambaConfig, but default arg in create_block in mamba_ssm repo; used in layer norm
  norm_epsilon: 1e-5

  # Used in init_weights
  initializer_cfg:
    initializer_range: 0.02
    rescale_prenorm_residual: true
    n_residuals_per_layer: 1

  # Caduceus-specific params
  bidirectional: true
  bidirectional_strategy: "add"
  bidirectional_weight_tie: true
  rcps: false

  # RNA cross-layer memory
  use_memory: true
  memory_writer_mode: "bcw"  # single | average | scalar_gate | bcw
  memory_share_direction_projection: true
  memory_single_direction: "fwd"
  memory_d_sum: 256
  memory_d_mem: 128
  memory_use_write_score: true
  memory_num_global_slots: 1
  memory_num_local_slots: 8
  memory_pooling: "weighted"  # mean | max | weighted
  memory_use_layer_embedding: true
  memory_use_slot_type_embedding: true
  memory_use_slot_position_embedding: true
  memory_n_heads: 4
  memory_attn_dropout: 0.0
  memory_reader_gate_init: -4.0
  memory_share_reader: true
  memory_write_stride: 4
  memory_read_stride: 1
  memory_max_slots: 64
  memory_replacement: "fifo"
  memory_collect_stats: true
  memory_persist_across_batches: false
  pad_token_id: 4

  # Used for RCPSEmbedding / RCPSLMHead (will be filled in during model instantiation using info from tokenizer)
  complement_map: null
